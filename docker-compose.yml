# A complete server-side deployment: veil on 443, a decoy site behind it, and
# certificate renewal.
#
# Before starting:
#   1. Point your domain's A record at this host.
#   2. Put your domain in the DOMAIN variable below (or in a .env file).
#   3. Copy examples/server.json to ./server.json and set a real password.
#   4. Get the first certificate:
#        docker compose run --rm certbot certonly --standalone -d "$DOMAIN"

services:
  veil:
    build:
      context: .
      args:
        VERSION: docker
    restart: unless-stopped
    # Host networking keeps the client's source address visible to the server
    # and avoids a second layer of NAT on every connection.
    network_mode: host
    volumes:
      - ./server.json:/etc/veil/server.json:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - decoy

  # The site an unauthenticated probe is handed. It listens on loopback only:
  # 443 stays the one port open to the internet.
  decoy:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/nginx-decoy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./decoy-site:/var/www/decoy:ro
      - ./certbot-webroot:/var/www/html:ro

  # Renewal runs twice a day; Let's Encrypt certificates last 90 days and
  # certbot only acts when one is close to expiring.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-webroot:/var/www/html
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/html --quiet;
             sleep 12h & wait $${!}; done"
