# The decoy site the veil server hides behind.
#
# Anything that fails authentication is handed to this server, byte for byte,
# so what it serves is what a prober sees. Two rules make it convincing:
# it must look like a site someone would plausibly run, and it must never
# mention veil, proxies, or the fact that it is a decoy.
#
# It listens on loopback only. The internet reaches it exclusively through
# veil's fallback, so port 443 stays the single open port.

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /var/www/decoy;
    index index.html;

    # Serving a real certificate's ACME challenges from here keeps renewals
    # working while port 80 is the only other thing exposed.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # No proxy-shaped headers, and nothing that identifies the software stack
    # more precisely than any other nginx host on the internet.
    server_tokens off;
}
