<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>游玩时间系统 · fake-minecraft-2v</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>⛏️</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>游玩时间系统</h1>
      <p class="subtitle">每次 30 分钟 · 冷却 6 小时 · 后台照常计时</p>
    </header>

    <section class="panel" id="panel" data-phase="ready">
      <div class="badge" id="badge">可以领取</div>

      <div class="countdown" id="countdown">30:00</div>
      <div class="countdown-label" id="countdownLabel">点击下方按钮领取本轮游玩时间</div>

      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

      <div class="actions">
        <button class="btn btn-primary" id="claimBtn">领取 30 分钟</button>
        <button class="btn" id="endBtn" hidden>提前结束</button>
      </div>

      <p class="hint" id="hint"></p>
    </section>

    <section class="game" id="game" aria-live="polite">
      <div class="game-locked" id="gameLocked">
        <span class="lock">🔒</span>
        <p id="lockedText">游玩区域已锁定</p>
      </div>
      <div class="game-open" id="gameOpen" hidden>
        <span class="pick">⛏️</span>
        <p>游玩中，尽情挖矿！</p>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><span class="stat-value" id="statSessions">0</span><span class="stat-label">完成场次</span></div>
      <div class="stat"><span class="stat-value" id="statTotal">0 分钟</span><span class="stat-label">累计游玩</span></div>
      <div class="stat"><span class="stat-value" id="statNext">—</span><span class="stat-label">下次可领取</span></div>
    </section>

    <footer class="footer">
      <button class="link" id="resetBtn">清空进度</button>
      <span class="dot">·</span>
      <label class="link"><input type="checkbox" id="fastMode" /> 演示模式（30 秒 / 1 分钟）</label>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
