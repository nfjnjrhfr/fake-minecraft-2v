<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b23" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>游玩时间系统</title>
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>游玩时间系统</h1>
      <p class="subtitle">学满 30 分钟 · 换 30 分钟游玩 · 冷却 6 小时</p>
    </header>

    <!-- 切回来时告诉你离开期间发生了什么 -->
    <div class="banner" id="banner" hidden></div>

    <!-- 通知没开的话提示开启, 否则切走就没人叫你了 -->
    <div class="banner banner-warn" id="notifyBanner" hidden>
      <span id="notifyText">开启通知，切到别的 App 时间到了才能叫醒你</span>
      <button class="btn btn-small" id="notifyBtn">开启通知</button>
    </div>

    <section class="panel" id="panel" data-phase="study_required">
      <div class="badge" id="badge">需要学习</div>

      <div class="countdown" id="countdown">--:--</div>
      <div class="countdown-label" id="countdownLabel">先完成学习才能登记</div>

      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

      <div class="actions">
        <button class="btn btn-primary" id="claimBtn">登记 30 分钟</button>
        <button class="btn" id="endBtn" hidden>提前结束</button>
      </div>

      <p class="hint" id="hint"></p>
    </section>

    <!-- 两道门槛 -->
    <section class="gates">
      <div class="gate" id="gateStudy">
        <span class="gate-icon" id="gateStudyIcon">○</span>
        <span class="gate-name">学习</span>
        <span class="gate-value" id="gateStudyValue">还差 30:00</span>
      </div>
      <div class="gate" id="gateCooldown">
        <span class="gate-icon" id="gateCooldownIcon">✓</span>
        <span class="gate-name">冷却</span>
        <span class="gate-value" id="gateCooldownValue">已结束</span>
      </div>
    </section>

    <!-- 学习卡片 -->
    <section class="card study" id="studyCard">
      <div class="card-head">
        <h2>学习</h2>
        <span class="study-credits" id="studyCredits"></span>
      </div>

      <div class="study-time"><span id="studyBanked">00:00</span> <span class="study-need" id="studyNeed">/ 30:00</span></div>
      <div class="progress progress-study"><div class="progress-bar" id="studyBar"></div></div>

      <div class="actions">
        <button class="btn btn-study" id="studyBtn">开始学习</button>
      </div>
      <p class="hint" id="studyHint">学习时间也按真实时间走，可以锁屏去看书。</p>
    </section>

    <!-- 游玩区域 -->
    <section class="game" id="game" aria-live="polite">
      <div class="game-locked" id="gameLocked">
        <span class="lock">🔒</span>
        <p id="lockedText">游玩区域已锁定</p>
      </div>
      <div class="game-open" id="gameOpen" hidden>
        <span class="pick">⛏️</span>
        <p>游玩中，可以切到游戏 App 了</p>
        <p class="game-note">时间到会通知你</p>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><span class="stat-value" id="statSessions">0</span><span class="stat-label">完成场次</span></div>
      <div class="stat"><span class="stat-value" id="statPlayed">0 分钟</span><span class="stat-label">累计游玩</span></div>
      <div class="stat"><span class="stat-value" id="statStudied">0 分钟</span><span class="stat-label">累计学习</span></div>
    </section>

    <footer class="footer">
      <label class="opt"><input type="checkbox" id="pauseOnHide" /> 离开页面时暂停学习计时</label>
      <label class="opt"><input type="checkbox" id="fastMode" /> 演示模式（学 20 秒 / 玩 30 秒 / 冷却 1 分钟）</label>
      <button class="link" id="resetBtn">清空进度</button>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
