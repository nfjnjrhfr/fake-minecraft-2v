<title>MineTube</title>
<style>
/* MineTube — layout modelled on a familiar video site, with its own branding.
   Dark is the default; .light on <html> flips the token set. */

:root {
  --brand: #ff0033;
  --bg: #0f0f0f;
  --bg-elev: #212121;
  --bg-hover: #272727;
  --bg-chip: #272727;
  --bg-chip-active: #f1f1f1;
  --fg-chip-active: #0f0f0f;
  --fg: #f1f1f1;
  --fg-dim: #aaaaaa;
  --border: #303030;
  --overlay: rgba(0, 0, 0, 0.6);
  --shadow: 0 4px 32px rgba(0, 0, 0, 0.6);
  --header-h: 56px;
  --side-w: 240px;
  --rail-w: 72px;
  --radius: 12px;
}

html.light {
  --bg: #ffffff;
  --bg-elev: #f2f2f2;
  --bg-hover: #e5e5e5;
  --bg-chip: #f2f2f2;
  --bg-chip-active: #0f0f0f;
  --fg-chip-active: #ffffff;
  --fg: #0f0f0f;
  --fg-dim: #606060;
  --border: #e5e5e5;
  --overlay: rgba(0, 0, 0, 0.5);
  --shadow: 0 4px 32px rgba(0, 0, 0, 0.2);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Roboto,
    -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 600; }
.ic { fill: currentColor; display: block; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #6b6b6b66; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: #909090aa; }

/* ------------------------------------------------------------------ topbar */

.topbar {
  position: fixed;
  inset: 0 0 auto 0;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  background: var(--bg);
  z-index: 60;
}

.topbar-left { display: flex; align-items: center; gap: 8px; min-width: 170px; }
.topbar-center { flex: 1; display: flex; justify-content: center; }
.topbar-right { display: flex; align-items: center; gap: 4px; justify-content: flex-end; min-width: 170px; }

.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--fg);
  position: relative;
}
.icon-btn:hover { background: var(--bg-hover); }
.icon-btn.has-dot::after {
  content: "3";
  position: absolute; top: 3px; right: 2px;
  min-width: 15px; height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--brand);
  color: #fff;
  font-size: 10px; line-height: 15px; text-align: center;
}

.logo { display: flex; align-items: center; gap: 4px; }
.logo-mark { display: block; }
.logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.6px; }
.logo-text sup { font-size: 10px; font-weight: 500; color: var(--fg-dim); margin-left: 1px; }

.search-wrap { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 690px; position: relative; }
.search {
  display: flex; flex: 1;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 40px;
  overflow: hidden;
  background: color-mix(in srgb, var(--bg-elev) 55%, transparent);
}
.search:focus-within { border-color: #3ea6ff; }
.search input {
  flex: 1;
  padding: 0 16px;
  border: 0; outline: 0;
  background: transparent;
  color: var(--fg);
  font-size: 16px;
}
.search input::placeholder { color: var(--fg-dim); }
.search-btn {
  width: 64px;
  display: grid; place-items: center;
  background: var(--bg-elev);
  border-left: 1px solid var(--border);
  color: var(--fg);
}
.search-btn:hover { background: var(--bg-hover); }
.mic { background: var(--bg-elev); flex: none; }

.suggestions {
  position: absolute;
  top: 46px; left: 0; right: 56px;
  background: var(--bg-elev);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 8px 0;
  z-index: 80;
  max-height: 60vh; overflow: auto;
}
.suggestion {
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 6px 16px;
  text-align: left;
  color: var(--fg);
}
.suggestion span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggestion:hover { background: var(--bg-hover); }

.avatar {
  width: 36px; height: 36px;
  flex: none;
  border-radius: 50%;
  background: var(--c, #555);
  color: #fff;
  display: grid; place-items: center;
  font-size: 15px; font-weight: 600;
}
.avatar.me { width: 32px; height: 32px; background: #7a5cff; font-size: 13px; margin-left: 8px; }
.avatar.tiny { width: 24px; height: 24px; font-size: 11px; }
.avatar.lg { width: 40px; height: 40px; }
.avatar.xl { width: 96px; height: 96px; font-size: 40px; }

/* ----------------------------------------------------------------- sidebar */

.sidebar {
  position: fixed;
  top: var(--header-h); bottom: 0; left: 0;
  width: var(--side-w);
  padding: 12px;
  overflow-y: auto;
  background: var(--bg);
  z-index: 55;
  scrollbar-width: thin;
}
.sidebar::-webkit-scrollbar { width: 0; }
.sidebar:hover::-webkit-scrollbar { width: 8px; }

.side-section { padding: 8px 0; border-bottom: 1px solid var(--border); }
.side-section:last-of-type { border-bottom: 0; }
.side-title { font-size: 16px; font-weight: 500; padding: 6px 12px; }
.side-link {
  display: flex; align-items: center; gap: 24px;
  height: 40px;
  padding: 0 12px;
  border-radius: 10px;
  font-size: 14px;
}
.side-link:hover { background: var(--bg-hover); }
.side-link .ic { flex: none; }
.side-link span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { padding: 16px 12px; color: var(--fg-dim); font-size: 12px; }
.side-foot p { margin: 0 0 12px; }
.side-copy { opacity: 0.7; }

.scrim {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 54;
  display: none;
}
body.drawer-open .scrim { display: block; }

/* Collapsed rail: icons only, labels underneath. */
body.rail .sidebar { width: var(--rail-w); padding: 12px 4px; }
body.rail .side-link {
  flex-direction: column;
  gap: 4px;
  height: 74px;
  justify-content: center;
  font-size: 10px;
  padding: 0 2px;
}
body.rail .side-title,
body.rail .side-foot,
body.rail .side-section:nth-of-type(n+3) { display: none; }
body.rail .view { margin-left: var(--rail-w); }

.view {
  margin-left: var(--side-w);
  padding: calc(var(--header-h) + 12px) 24px 60px;
  min-height: 100vh;
}

/* On the watch page the sidebar becomes an overlay drawer, like the real thing. */
body.watch-mode .sidebar { transform: translateX(-100%); transition: transform 0.15s ease; }
body.watch-mode.drawer-open .sidebar { transform: none; }
body.watch-mode .view { margin-left: 0; padding-left: 24px; padding-right: 24px; }

@media (max-width: 1000px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.15s ease; }
  body.drawer-open .sidebar { transform: none; }
  .view, body.rail .view { margin-left: 0; }
  .topbar-left { min-width: auto; }
  .logo-text { display: none; }
}

/* Phones: drop the secondary chrome so the search field still fits. */
@media (max-width: 700px) {
  .topbar { padding: 0 8px; gap: 4px; }
  .topbar-right { min-width: auto; gap: 0; }
  .topbar-right .icon-btn:not(#theme-btn) { display: none; }
  .mic { display: none; }
  .search input { font-size: 14px; padding: 0 12px; }
  .search-btn { width: 48px; }
  .suggestions { right: 0; }
  .view { padding-left: 12px; padding-right: 12px; }
  body.watch-mode .view { padding-left: 0; padding-right: 0; }
  body.watch-mode .player-box { border-radius: 0; }
  body.watch-mode .watch-title,
  body.watch-mode .watch-actions,
  body.watch-mode .desc,
  body.watch-mode .comments,
  body.watch-mode .watch-secondary { padding-left: 12px; padding-right: 12px; }
  .action-row { margin-left: 0; overflow-x: auto; }
  .player-time { font-size: 11px; padding: 0 4px; }
  .js-next, .js-mini { display: none; }
}

/* ------------------------------------------------------------------- chips */

.chips {
  position: sticky;
  top: var(--header-h);
  display: flex; gap: 12px;
  padding: 12px 0;
  margin-bottom: 4px;
  background: var(--bg);
  overflow-x: auto;
  scrollbar-width: none;
  z-index: 40;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  padding: 0 12px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg-chip);
  font-size: 14px;
  white-space: nowrap;
}
.chip:hover { background: var(--bg-hover); }
.chip.active { background: var(--bg-chip-active); color: var(--fg-chip-active); }

/* ------------------------------------------------------------------- cards */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 40px 16px;
}
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; gap: 24px; } }

.thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
}
.thumb-canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
.card.previewing .thumb { border-radius: 0; }
.badge {
  position: absolute;
  right: 8px; bottom: 8px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.8);
  color: #fff;
  font-size: 12px; font-weight: 500;
}
.badge-live { background: var(--brand); }
.thumb-progress {
  position: absolute; left: 0; bottom: 0;
  height: 3px; width: 0;
  background: var(--brand);
}
.card:visited .thumb-progress { width: 42%; }

.card { display: block; }
.card-body { display: flex; gap: 12px; padding: 12px 0 0; position: relative; }
.card-meta { min-width: 0; flex: 1; }
.card-title {
  font-size: 16px; font-weight: 500; line-height: 1.4;
  max-height: 2.8em; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card-sub { color: var(--fg-dim); font-size: 13px; }
.card-channel { display: inline-flex; align-items: center; gap: 4px; }
.card-channel:hover { color: var(--fg); }
.verified { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--fg-dim); color: var(--bg); }
.verified .ic { width: 10px; height: 10px; }
.card-more { position: absolute; right: -6px; top: 8px; padding: 6px; border-radius: 50%; color: var(--fg); opacity: 0; }
.card:hover .card-more { opacity: 1; }
.card-more:hover { background: var(--bg-hover); }

/* list variant (search results) */
.results { display: flex; flex-direction: column; gap: 16px; max-width: 1096px; }
.card-list { display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
.card-list .card-body { padding: 0; }
.card-list .card-title { font-size: 18px; -webkit-line-clamp: 2; margin-bottom: 4px; }
.card-list .card-channel-line { margin: 8px 0; }
.card-desc { color: var(--fg-dim); font-size: 12px; margin: 4px 0 0; }
.card-channel-line { display: flex; align-items: center; gap: 8px; }
@media (max-width: 800px) { .card-list { grid-template-columns: 1fr; } }

/* compact variant (up next) */
.card-compact { display: grid; grid-template-columns: 168px 1fr; gap: 8px; }
.card-compact .card-body { padding: 0; }
.card-compact .card-title { font-size: 14px; }
.card-compact .card-sub { font-size: 12px; }
.card-compact .card-more { top: 0; right: 0; }

.results-head {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1096px;
  padding: 8px 0 16px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.filter-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; }
.filter-btn:hover { background: var(--bg-hover); }
.results-count { color: var(--fg-dim); font-size: 13px; }

.page-title { font-size: 24px; margin-bottom: 20px; }
.empty { grid-column: 1 / -1; display: grid; place-items: center; gap: 12px; padding: 80px 0; color: var(--fg-dim); }
.empty-icon { opacity: 0.4; }

/* ----------------------------------------------------------------- channel */

.channel { max-width: 1284px; margin: 0 auto 24px; }
.channel-banner { height: 170px; border-radius: 14px; background: linear-gradient(110deg, var(--c), #111 70%); }
.channel-head { display: flex; align-items: center; gap: 24px; padding: 20px 0; }
.channel-info { flex: 1; min-width: 0; }
.channel-info h1 { font-size: 24px; }
.channel-sub { color: var(--fg-dim); font-size: 13px; margin-top: 4px; }
.channel-desc { color: var(--fg-dim); font-size: 13px; margin: 6px 0 0; }
.channel-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border); }
.channel-tab { padding: 12px 0; color: var(--fg-dim); border-bottom: 2px solid transparent; }
.channel-tab.active { color: var(--fg); border-bottom-color: var(--fg); }

.subscribe {
  flex: none;
  height: 36px; padding: 0 16px;
  border-radius: 18px;
  background: var(--fg); color: var(--bg);
  font-weight: 500;
}
.subscribe:hover { opacity: 0.85; }
.subscribe.subscribed { background: var(--bg-elev); color: var(--fg); }

/* ------------------------------------------------------------------- watch */

.watch {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 402px;
  gap: 24px;
  max-width: 1754px;
  margin: 0 auto;
}
.watch-primary { min-width: 0; }
.watch-secondary { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 1100px) { .watch { grid-template-columns: 1fr; } }

body.theater .watch { grid-template-columns: 1fr; max-width: none; }
/* Cap by width rather than height so the 16:9 box never letterboxes itself
   into a lopsided gap. */
body.theater .player-box { margin: 0 auto 16px; border-radius: 0; width: 100%; max-width: calc((100vh - 150px) * 16 / 9); }
body.theater .watch-secondary { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

.player-box { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: #000; }
.watch-title { font-size: 20px; margin: 12px 0 8px; line-height: 1.35; }

.watch-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.channel-row { display: flex; align-items: center; gap: 12px; }
.channel-name { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 500; }
.channel-subs { color: var(--fg-dim); font-size: 12px; }
.action-row { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

.pill-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 16px;
  border-radius: 18px;
  background: var(--bg-elev);
  font-size: 14px; font-weight: 500;
  white-space: nowrap;
}
.pill-btn:hover { background: var(--bg-hover); }
.pill-btn.on { background: var(--bg-hover); color: #3ea6ff; }
.pill-btn.icon-only { padding: 0 10px; }
.pill-group { display: flex; background: var(--bg-elev); border-radius: 18px; }
.pill-group .pill-btn { background: none; }
.pill-group .pill-btn:first-child { border-right: 1px solid var(--border); }

.desc {
  background: var(--bg-elev);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 24px;
  font-size: 14px;
}
.desc-head { font-weight: 600; margin-bottom: 6px; }
.desc-body { white-space: pre-line; max-height: 3em; overflow: hidden; }
.desc.open .desc-body { max-height: none; }
.desc-toggle { margin-top: 6px; font-weight: 600; }

.comments-head { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
.comments-head h2 { font-size: 20px; }
.text-btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; padding: 8px 12px; border-radius: 18px; }
.text-btn:hover { background: var(--bg-hover); }
.primary-btn { background: #3ea6ff; color: #0f0f0f; padding: 8px 16px; border-radius: 18px; font-weight: 500; }

.comment-add { display: flex; gap: 16px; margin-bottom: 28px; }
.comment-add-body { flex: 1; }
.comment-input {
  width: 100%;
  padding: 4px 0 6px;
  background: none; border: 0; border-bottom: 1px solid var(--border);
  color: var(--fg); font-size: 14px; outline: none;
}
.comment-input:focus { border-bottom-color: var(--fg); }
.comment-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

.comment-list { display: flex; flex-direction: column; gap: 16px; }
.comment { display: flex; gap: 16px; }
.comment-body { min-width: 0; }
.comment-head { display: flex; align-items: baseline; gap: 8px; }
.cm-author { font-size: 13px; font-weight: 600; }
.cm-time { color: var(--fg-dim); font-size: 12px; }
.cm-text { margin: 2px 0 6px; white-space: pre-line; }
.cm-actions { display: flex; align-items: center; gap: 8px; }
.cm-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-dim); font-size: 12px; padding: 4px; border-radius: 14px; }
.cm-btn:hover { background: var(--bg-hover); }
.cm-btn.on { color: #3ea6ff; }
.cm-btn.text { padding: 6px 12px; font-weight: 600; color: var(--fg); }
.cm-replies { color: #3ea6ff; font-weight: 600; font-size: 13px; margin-top: 6px; padding: 4px 8px; border-radius: 14px; }
.cm-replies:hover { background: #3ea6ff22; }

.up-next-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.up-next-head > span { font-weight: 500; }
.autoplay { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-dim); cursor: pointer; }
.switch { position: relative; width: 34px; height: 14px; border-radius: 7px; background: var(--fg-dim); display: inline-block; }
.switch input { position: absolute; opacity: 0; }
.knob { position: absolute; top: -3px; left: 0; width: 20px; height: 20px; border-radius: 50%; background: #909090; transition: transform 0.15s; }
.switch input:checked + .knob { transform: translateX(16px); background: var(--fg); }

/* ------------------------------------------------------------------ player */

/* The Player mounts onto .player-box itself, so this must not re-position it. */
.player { position: relative; background: #000; outline: none; }
/* Absolute so the canvas's intrinsic size can never feed back into layout —
   otherwise resizing the canvas grows the box that the canvas is measured from. */
.player-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.player.is-mini { position: fixed; right: 16px; bottom: 16px; width: 400px; height: 225px; inset: auto 16px 16px auto; z-index: 90; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.player.is-fullscreen { border-radius: 0; aspect-ratio: auto; width: 100%; height: 100%; }

.player-scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 100%);
  opacity: 1; transition: opacity 0.2s;
  pointer-events: none;
}
.player.hide-ui .player-scrim { opacity: 0; }

.player-bigplay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: #fff;
  background: rgba(0, 0, 0, 0.15);
  transition: opacity 0.15s;
}
.player-bigplay .ic { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
.player.is-playing .player-bigplay { opacity: 0; pointer-events: none; }

.player-livebadge {
  position: absolute; top: 12px; left: 12px;
  display: flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 4px;
  background: var(--brand); color: #fff; font-size: 12px; font-weight: 600;
}
.player-livebadge span { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: 0.2; } }

.player-toast {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 18px; border-radius: 4px;
  background: rgba(0, 0, 0, 0.75); color: #fff;
  font-size: 18px; font-weight: 600;
  pointer-events: none;
}

.player-controls {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 12px 6px;
  opacity: 1; transition: opacity 0.2s, transform 0.2s;
}
.player.hide-ui .player-controls { opacity: 0; transform: translateY(8px); pointer-events: none; }
.player.hide-ui { cursor: none; }

.player-scrub { position: relative; height: 16px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.scrub-track { position: relative; width: 100%; height: 3px; background: rgba(255,255,255,0.28); transition: height 0.1s; }
.player-scrub:hover .scrub-track { height: 5px; }
.scrub-buffer { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(255,255,255,0.45); }
.scrub-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--brand); }
.scrub-knob { position: absolute; top: 50%; left: 0; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: var(--brand); transform: translateY(-50%) scale(0); transition: transform 0.1s; }
.player-scrub:hover .scrub-knob { transform: translateY(-50%) scale(1); }
.scrub-fill { transition: none; }
.player-scrub:hover .scrub-knob { left: var(--knob, 0); }

.scrub-preview {
  position: absolute; bottom: 22px; transform: translateX(-50%);
  background: #000; border: 2px solid rgba(255,255,255,0.25); border-radius: 4px;
  padding: 0; pointer-events: none; text-align: center;
}

  const out = [];

  const peakAt = clamp((video.peak ?? 0.62) * video.duration, 8, video.duration - 6);
  const peakKind = video.peakKind || kinds[0];
  out.push({ t: peakAt, kind: peakKind, headline: true });

  // a compilation ("爆炸 100 次") wants beats stacked much closer together
  const gap = video.dense ? 7 : 18;
  const spread = video.dense ? 9 : 26;
  let t = 6 + rng() * 14;
  while (t < video.duration - 5) {
    if (Math.abs(t - peakAt) > 10) {
      out.push({ t, kind: kinds[Math.floor(rng() * kinds.length)] });
    }
    t += gap + rng() * spread;
  }
  // chatter between the action so the clip is never silent for long
  let c = 4 + rng() * 8;
  while (c < video.duration - 4) {
    out.push({ t: c, kind: 'chatter', text: CHAT_FILLER[Math.floor(rng() * CHAT_FILLER.length)] });
    c += 12 + rng() * 22;
  }

  out.sort((a, b) => a.t - b.t);
  out.forEach((b, i) => {
    b.i = i;
    b.rng = makeRng(`${video.id}:${i}`)();
  });
  scripts.set(video.id, out);
  return out;
}

function peakTime(video) {
  return scriptFor(video).find((b) => b.headline)?.t ?? video.duration * 0.5;
}

/* Everything the HUD and the overlays need, replayed from the start of the
   clip so any seek lands on a consistent state. */
function stateAt(script, t, video) {
  let hearts = 20;          // half-hearts
  let lastDamage = -99;
  let level = 0;
  let shake = 0;
  let flash = 0;
  let tint = null;
  let tintAmount = 0;
  const chat = [];
  let toast = null;

  for (const b of script) {
    if (b.t > t) break;
    const age = t - b.t;
    if (b.kind === 'chatter') {
      chat.push({ text: b.text, age });
      continue;
    }
    const def = BEATS[b.kind];
    if (!def) continue;

    if (def.damage) {
      // regen since the previous hit, then take the new one
      hearts = Math.min(20, hearts + Math.max(0, (b.t - lastDamage - 4)) * 0.35);
      hearts = Math.max(1, hearts - def.damage);
      lastDamage = b.t;
    }
    if (b.kind === 'levelup' || b.kind === 'ore') level += b.kind === 'ore' ? 3 : 1;
    if (def.chat) chat.push({ text: def.chat, age });
    if (def.toast) toast = { text: def.toast, age };
    if (b.kind === 'levelup') toast = { text: ACHIEVEMENTS[Math.floor(b.rng * ACHIEVEMENTS.length)], age };

    if (age < 1.2) {
      shake = Math.max(shake, def.shake * (1 - age / 1.2));
      flash = Math.max(flash, def.flash * Math.max(0, 1 - age / 0.3));
    }
    if (def.tint && age < 2.5) {
      tint = def.tint;
      tintAmount = Math.max(tintAmount, 0.35 * (1 - age / 2.5));
    }
  }

  hearts = Math.min(20, hearts + Math.max(0, (t - lastDamage - 4)) * 0.35);
  const hurt = clamp(1 - (t - lastDamage) / 0.7, 0, 1);

  return {
    hearts,
    level,
    shake,
    flash,
    tint,
    tintAmount,
    hurt,
    chat: chat.filter((c) => c.age < 11).slice(-5),
    toast: toast && toast.age < 4.5 ? toast : null,
  };
}

/* ------------------------------------------------------------- event props */

function explosion(ctx, w, h, cx, cy, age, s, rngv) {
  const p = clamp(age / 0.85, 0, 1);
  const r = s * (1 + p * 12);

  // hot core, only for the first instants
  if (p < 0.4) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.1);
    g.addColorStop(0, `rgba(255,240,190,${0.95 - p * 2})`);
    g.addColorStop(0.45, `rgba(255,140,40,${0.7 - p * 1.5})`);
    g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4);
  }

  ctx.globalAlpha = 1 - p;
  // blocky fireball: rings of squares rather than a smooth circle
  for (let i = 0; i < 30; i++) {
    const a = (i / 30) * Math.PI * 2 + rngv * 6;
    const rr = r * (0.5 + ((i * 37 + rngv * 100) % 55) / 100);
    const bx = cx + Math.cos(a) * rr;
    const by = cy + Math.sin(a) * rr * 0.75;
    const sz = s * (1.5 - p) * (0.6 + ((i * 13) % 40) / 60);
    const shade = i % 5;
    ctx.fillStyle = shade === 0 ? '#fff3c4' : shade === 1 ? '#ffb03d'
      : shade === 2 ? '#ff6a1a' : shade === 3 ? '#a83a12' : '#59524d';
    ctx.fillRect(bx - sz / 2, by - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  // debris arcing out and falling
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    const d = s * (2 + i % 5) * age * 6;
    const bx = cx + Math.cos(a) * d;
    const by = cy + Math.sin(a) * d * 0.6 + age * age * s * 26;
    if (by > h) continue;
    ctx.fillStyle = i % 2 ? '#6b4a24' : '#5aa832';
    ctx.fillRect(bx, by, s * 0.5, s * 0.5);
  }
}

function creeperSprite(ctx, x, y, s, flashAmt) {
  const green = flashAmt > 0 ? `rgba(255,255,255,${flashAmt})` : null;
  ctx.fillStyle = '#4f9e46';
  ctx.fillRect(x, y, s * 2, s * 2);       // head
  ctx.fillRect(x + s * 0.35, y + s * 2, s * 1.3, s * 2.4); // body
  ctx.fillStyle = '#0d1a0d';
  ctx.fillRect(x + s * 0.3, y + s * 0.5, s * 0.5, s * 0.5);
  ctx.fillRect(x + s * 1.2, y + s * 0.5, s * 0.5, s * 0.5);
  ctx.fillRect(x + s * 0.7, y + s * 1.1, s * 0.6, s * 0.8);
  ctx.fillStyle = '#3d7a36';
  ctx.fillRect(x + s * 0.35, y + s * 4.4, s * 0.5, s * 0.6);
  ctx.fillRect(x + s * 1.15, y + s * 4.4, s * 0.5, s * 0.6);
  if (green) {
    ctx.fillStyle = green;
    ctx.fillRect(x, y, s * 2, s * 5);
  }
}

function lightningBolt(ctx, w, h, x, age, s) {
  if (age > 0.28) return;
  ctx.globalAlpha = 1 - age / 0.28;
  ctx.fillStyle = '#eaf0ff';
  let bx = x;
  for (let y = 0; y < h * 0.72; y += s) {
    bx += ((y / s) % 3 === 0 ? 1 : -1) * s * 0.5;
    ctx.fillRect(bx, y, s * 0.7, s);
  }
  ctx.globalAlpha = 1;
}

/* Draws whatever is happening right now on top of the scene. */
function drawEvents(ctx, w, h, t, script, opts = {}) {
  const s = w / 40;
  const ground = h * (opts.ground ?? 0.72);

  for (const b of script) {
    const age = t - b.t;
    const def = BEATS[b.kind];
    if (!def) continue;
    if (age < -def.lead || age > 1.6) continue;

    const cx = w * (0.2 + b.rng * 0.6);

    if (b.kind === 'creeper') {
      if (age < 0) {
        // walks in from the right, flashing white just before it blows
        const p = 1 + age / def.lead;
        const x = w * 0.95 - (w * 0.95 - cx) * p;
        const hop = Math.abs(Math.sin(age * 7)) * s * 0.3;
        const fl = age > -1.1 ? Math.abs(Math.sin(age * 16)) * 0.85 : 0;
        creeperSprite(ctx, x, ground - s * 5 - hop, s, fl);
      } else {
        explosion(ctx, w, h, cx, ground - s * 2, age, s, b.rng);
      }
    } else if (b.kind === 'tnt') {
      if (age < 0) {
        const blink = Math.sin(age * 18) > 0;
        block(ctx, cx, ground - s, s * 1.4, blink ? '#ffffff' : '#c73b2b', 0.14);
        ctx.fillStyle = blink ? '#c73b2b' : '#ffffff';
        ctx.fillRect(cx, ground - s * 0.7, s * 1.4, s * 0.35);
      } else {
        explosion(ctx, w, h, cx + s * 0.7, ground - s, age, s * 1.2, b.rng);
      }
    } else if (b.kind === 'fireball') {
      if (age < 0) {
        const p = 1 + age / def.lead;
        const fx = w * 0.15 + (cx - w * 0.15) * p;
        const fy = h * 0.3 + (ground - s * 2 - h * 0.3) * p * p;
        ctx.fillStyle = '#ffd27a';
        ctx.fillRect(fx, fy, s, s);
        ctx.fillStyle = '#ff7a18';
        ctx.fillRect(fx - s * 0.3, fy - s * 0.3, s * 0.5, s * 0.5);
        ctx.fillRect(fx + s * 0.8, fy + s * 0.8, s * 0.5, s * 0.5);
      } else {
        explosion(ctx, w, h, cx, ground - s * 2, age, s, b.rng);
      }
    } else if (b.kind === 'lightning') {
      lightningBolt(ctx, w, h, cx, age, s);
    } else if (b.kind === 'arrow') {
      const p = clamp(1 + age / def.lead, 0, 1.3);
      const ax = w * 1.02 - w * 0.9 * p;
      const ay = h * 0.42 + p * p * s * 3;
      ctx.fillStyle = '#d8d8d8';
      ctx.fillRect(ax, ay, s * 1.1, s * 0.2);
      ctx.fillStyle = '#8a8a8a';
      ctx.fillRect(ax - s * 0.25, ay - s * 0.1, s * 0.3, s * 0.4);
    } else if (b.kind === 'ore') {
      // sparkles popping off a freshly broken vein
      const p = clamp((age + def.lead) / (def.lead + 1.2), 0, 1);
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const d = s * 3 * p;
        ctx.globalAlpha = 1 - p;
        ctx.fillStyle = i % 2 ? '#5ad7d7' : '#ffffff';
        ctx.fillRect(cx + Math.cos(a) * d, ground - s * 3 + Math.sin(a) * d, s * 0.35, s * 0.35);
      }
      ctx.globalAlpha = 1;
    } else if (b.kind === 'treasure') {
      const p = clamp((age + def.lead) / (def.lead + 1.4), 0, 1);
      block(ctx, cx, ground - s * 1.2, s * 1.6, '#8a5a33', 0.14);
      ctx.fillStyle = '#f2c14e';
      for (let i = 0; i < 10; i++) {
        const gy = ground - s * 1.4 - p * s * (2 + i % 4);
        ctx.globalAlpha = 1 - p;
        ctx.fillRect(cx + s * (0.2 + (i % 5) * 0.3), gy, s * 0.28, s * 0.28);
      }
      ctx.globalAlpha = 1;
    } else if (b.kind === 'place' || b.kind === 'signal') {
      const p = clamp((age + def.lead) / (def.lead + 0.9), 0, 1);
      ctx.globalAlpha = 1 - p;
      ctx.fillStyle = b.kind === 'signal' ? '#ff4d4d' : '#ffffff';
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        ctx.fillRect(cx + Math.cos(a) * s * 2 * p, ground - s * 2 + Math.sin(a) * s * 2 * p, s * 0.3, s * 0.3);
      }
      ctx.globalAlpha = 1;
    }
  }
}

/* Full-frame overlays: hit flash, damage vignette, element tint. */
function drawOverlays(ctx, w, h, st) {
  if (st.tint && st.tintAmount > 0.01) {
    ctx.fillStyle = st.tint;
    ctx.globalAlpha = st.tintAmount;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  if (st.hurt > 0.01) {
    const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.62);
    g.addColorStop(0, 'rgba(180,0,0,0)');
    g.addColorStop(1, `rgba(170,0,0,${0.55 * st.hurt})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  if (st.flash > 0.01) {
    ctx.fillStyle = `rgba(255,250,235,${st.flash})`;
    ctx.fillRect(0, 0, w, h);
  }
}

/* A caption burned into the peak frame, the way a highlight clip would. */
function drawPeakCaption(ctx, w, h, text) {
  const size = h * 0.075;
  ctx.save();
  shadowText(ctx, text, w / 2, h * 0.9, size, '#ffe14d', 'center');
  ctx.restore();
}

/* ==== hud.js ==== */
/* The in-game HUD. This is what makes a canvas animation read as recorded
   gameplay rather than as a wallpaper: a hotbar, hearts that actually drop
   when something explodes, chat, and an achievement toast. */


const ITEMS = [
  { name: 'pick', count: null },
  { name: 'sword', count: null },
  { name: 'torch', count: 46 },
  { name: 'stone', count: 64 },
  { name: 'dirt', count: 38 },
  { name: 'bread', count: 12 },
  { name: 'bucket', count: null },
  { name: 'tnt', count: 7 },
  { name: 'bow', count: null },
];

function itemIcon(ctx, kind, x, y, u) {
  const px = (cx, cy, cw, ch, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(x + cx * u, y + cy * u, cw * u, ch * u);
  };
  switch (kind) {
    case 'pick':
      px(6, 16, 10, 3, '#8a5a33');
      px(4, 6, 14, 4, '#5ad7d7');
      px(2, 9, 4, 3, '#5ad7d7');
      px(16, 9, 4, 3, '#5ad7d7');
      break;
    case 'sword':
      px(9, 4, 4, 12, '#d8e6ea');
      px(6, 15, 10, 3, '#8a5a33');
      px(9, 18, 4, 4, '#6b4a24');
      break;
    case 'torch':
      px(9, 10, 4, 12, '#8a5a33');
      px(8, 5, 6, 6, '#ffcf5c');
      break;
    case 'stone':
      px(4, 5, 15, 15, '#8d8d95');
      px(6, 8, 4, 4, '#6f6f77');
      px(12, 13, 4, 4, '#a2a2aa');
      break;
    case 'dirt':
      px(4, 5, 15, 15, '#8a5a33');
      px(4, 5, 15, 4, '#5aa832');
      break;
    case 'bread':
      px(4, 8, 15, 9, '#c98d63');
      px(7, 6, 3, 3, '#b07a52');
      px(13, 6, 3, 3, '#b07a52');
      break;
    case 'bucket':
      px(6, 8, 11, 12, '#b9c0c7');
      px(7, 10, 9, 5, '#2f6fb0');
      break;
    case 'tnt':
      px(4, 6, 15, 13, '#c73b2b');
      px(4, 10, 15, 4, '#f0f0f0');
      px(10, 3, 3, 4, '#8a8a8a');
      break;
    case 'bow':
      px(6, 4, 3, 16, '#8a5a33');
      px(9, 3, 3, 3, '#8a5a33');
      px(9, 18, 3, 3, '#8a5a33');
      px(12, 6, 2, 12, '#e8e8e8');
      break;
  }
}

function heart(ctx, x, y, u, fill) {
  // 0 = empty container, 0.5 = half, 1 = full
  const draw = (color, half) => {
    ctx.fillStyle = color;
    const w = half ? 4 : 8;
    ctx.fillRect(x + u, y, w * u, 6 * u);
    ctx.fillRect(x, y + u, Math.min(w, 3) * u, 4 * u);
    if (!half) ctx.fillRect(x + 6 * u, y + u, 3 * u, 4 * u);
    ctx.fillRect(x + 2 * u, y + 6 * u, Math.min(w, 5) * u, 2 * u);
  };
  draw('rgba(20,10,10,0.75)', false);
  if (fill >= 1) draw('#ff3b3b', false);
  else if (fill >= 0.5) draw('#ff3b3b', true);
}

function drumstick(ctx, x, y, u, full) {
  ctx.fillStyle = full ? '#c98d63' : 'rgba(20,10,10,0.7)';
  ctx.fillRect(x + 2 * u, y, 5 * u, 5 * u);
  ctx.fillRect(x, y + 4 * u, 7 * u, 3 * u);
  ctx.fillStyle = full ? '#f0e0c0' : 'rgba(20,10,10,0.7)';
  ctx.fillRect(x + 6 * u, y + 5 * u, 3 * u, 2 * u);
}

function drawHud(ctx, w, h, t, video, st) {
  const u = h / 260;              // one "GUI pixel"
  const slot = u * 22;
  const barW = slot * 9;
  const barX = (w - barW) / 2;
  const barY = h - slot - u * 26;   // clear of the player's control bar

  ctx.save();

  // crosshair
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillRect(w / 2 - u * 5, h / 2 - u, u * 10, u * 2);
  ctx.fillRect(w / 2 - u, h / 2 - u * 5, u * 2, u * 10);

  // hotbar
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(barX, barY, barW, slot);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = Math.max(1, u);
  ctx.strokeRect(barX, barY, barW, slot);
  const selected = Math.floor(t / 7) % 9;
  ITEMS.forEach((item, i) => {
    const sx = barX + i * slot;
    itemIcon(ctx, item.name, sx + slot * 0.14, barY + slot * 0.14, (slot * 0.72) / 24);
    if (item.count) {
      shadowText(ctx, String(item.count), sx + slot * 0.92, barY + slot * 0.92, u * 8, '#ffffff', 'right');
    }
  });
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(2, u * 1.6);
  ctx.strokeRect(barX + selected * slot - u, barY - u, slot + u * 2, slot + u * 2);

  // hearts + hunger sit on the row above the hotbar
  const rowY = barY - u * 13;
  for (let i = 0; i < 10; i++) {
    heart(ctx, barX + i * u * 9, rowY, u, clamp(st.hearts / 2 - i, 0, 1));
  }
  const hunger = clamp(10 - Math.floor(t / 90), 4, 10);
  for (let i = 0; i < 10; i++) {
    drumstick(ctx, barX + barW - u * 9 - i * u * 9, rowY, u, i < hunger);
  }

  // xp bar + level
  const xpY = barY - u * 4;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(barX, xpY, barW, u * 2.6);
  ctx.fillStyle = '#7ddc3a';
  ctx.fillRect(barX, xpY, barW * ((t / 24) % 1), u * 2.6);
  shadowText(ctx, String(st.level), w / 2, xpY - u * 1.5, u * 9, '#7ddc3a', 'center');

  // chat log, fading out with age
  st.chat.forEach((line, i) => {
    const alpha = clamp(1 - (line.age - 8) / 3, 0, 1);
    const y = rowY - u * 16 - (st.chat.length - 1 - i) * u * 11;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    const text = `<${video.channelObj?.name || 'Steve'}> ${line.text}`;
    ctx.font = `600 ${u * 9}px "Segoe UI", system-ui, sans-serif`;
    const tw = ctx.measureText(text).width;
    ctx.fillRect(u * 6, y - u * 9, tw + u * 8, u * 12);
    shadowText(ctx, text, u * 10, y, u * 9, '#ffffff');
    ctx.globalAlpha = 1;
  });

  // achievement toast slides in from the top-right
  if (st.toast) {
    const p = clamp(st.toast.age / 0.4, 0, 1) * clamp((4.5 - st.toast.age) / 0.5, 0, 1);
    const tw = u * 120;
    const tx = w - tw - u * 8;
    const ty = u * 8 - (1 - p) * u * 30;
    ctx.globalAlpha = p;
    ctx.fillStyle = 'rgba(12,12,12,0.9)';
    ctx.fillRect(tx, ty, tw, u * 26);
    ctx.strokeStyle = '#ffe14d';
    ctx.lineWidth = Math.max(1, u * 1.4);
    ctx.strokeRect(tx, ty, tw, u * 26);
    shadowText(ctx, st.toast.text, tx + u * 8, ty + u * 17, u * 10, '#ffe14d');
    ctx.globalAlpha = 1;
  }

  // speedruns get a timer; everything else gets the F3 coordinate line
  if (video.channel === 'sp') {
    shadowText(ctx, formatTimer(t), u * 10, u * 20, u * 16, '#ffffff');
  } else {
    const x = (120 + t * 1.6).toFixed(1);
    const z = (-204 + Math.sin(t / 9) * 12).toFixed(1);
    shadowText(ctx, `XYZ: ${x} / 63 / ${z}`, u * 10, u * 16, u * 9, 'rgba(255,255,255,0.85)');
    shadowText(ctx, `${Math.round(58 + Math.sin(t) * 4)} fps`, u * 10, u * 28, u * 9, 'rgba(255,255,255,0.85)');
  }

  ctx.restore();
}

function formatTimer(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const cs = Math.floor((t % 1) * 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}

/* ==== sfx.js ==== */
/* Event sounds, synthesised on the fly with WebAudio — no audio files, same as
   the picture. Nothing plays until the viewer presses play, which also gives
   the AudioContext the user gesture browsers require. */

let ctx = null;
let master = null;

function ensure() {
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.value = 0.5;
  master.connect(ctx.destination);
  return ctx;
}

function resumeAudio() {
  const c = ensure();
  if (c && c.state === 'suspended') c.resume();
}

function setVolume(v) {
  if (master) master.gain.value = Math.max(0, Math.min(1, v)) * 0.5;
}

function env(node, t0, attack, decay, peak = 1) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  node.connect(g);
  g.connect(master);
  return g;
}

function noiseBuffer(seconds) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  return buf;
}

function boom(power = 1) {
  const t0 = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(1.2);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(900 * power, t0);
  lp.frequency.exponentialRampToValueAtTime(90, t0 + 0.8);
  src.connect(lp);
  env(lp, t0, 0.01, 1.0, 0.9 * power);
  src.start(t0);
  src.stop(t0 + 1.2);

  // the low thump underneath
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120 * power, t0);
  osc.frequency.exponentialRampToValueAtTime(32, t0 + 0.5);
  env(osc, t0, 0.01, 0.6, 0.7 * power);
  osc.start(t0);
  osc.stop(t0 + 0.7);
}

function blip(freq, dur, type = 'square', peak = 0.25) {
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  env(osc, t0, 0.005, dur, peak);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function chime(notes, gap = 0.09) {
  notes.forEach((f, i) => setTimeout(() => blip(f, 0.22, 'triangle', 0.22), i * gap * 1000));
}

function hiss() {
  const t0 = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(0.55);
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 2200;
  src.connect(hp);
  env(hp, t0, 0.06, 0.5, 0.35);
  src.start(t0);
  src.stop(t0 + 0.6);
}

/* Maps a scripted beat to a sound. Unknown beats stay silent on purpose. */
function playBeat(kind) {
  if (!ensure() || ctx.state !== 'running') return;
  switch (kind) {
    case 'creeper': boom(1); break;
    case 'tnt': boom(1.15); break;
    case 'fireball': boom(0.8); break;
    case 'lightning': boom(1.3); break;
    case 'arrow': blip(880, 0.08, 'sawtooth', 0.18); break;
    case 'lava': blip(160, 0.35, 'sawtooth', 0.2); break;
    case 'drown': blip(300, 0.2, 'sine', 0.18); break;
    case 'ore': chime([880, 1175]); break;
    case 'treasure': chime([659, 880, 1319]); break;
    case 'levelup': chime([784, 988, 1319]); break;
    case 'signal': blip(1046, 0.1, 'square', 0.2); break;
    case 'place': blip(220, 0.06, 'square', 0.14); break;
    default: break;
  }
}

/* The creeper's fuse, played during the lead-in rather than on the beat. */
function playFuse() {
  if (!ensure() || ctx.state !== 'running') return;
  hiss();
}

function playHurt() {
  if (!ensure() || ctx.state !== 'running') return;
  blip(180, 0.16, 'square', 0.22);
}

/* ==== scene.js ==== */
/* Procedural blocky scenes.
   Every video "plays" by rendering one of these into a canvas as a pure
   function of (time, seed) — which is what makes scrubbing work: seeking to
   0:42 just draws frame t=42, no buffering, no video files in the repo. */





const BLOCKS_ACROSS = 40;

/* ---------------------------------------------------------------- overworld */

const SKY_DAY = '#79b8ff';
const SKY_DUSK = '#f0895a';
const SKY_NIGHT = '#0b1030';

function overworld(ctx, w, h, t, seed, opts = {}) {
  const rng = makeRng(seed + ':ow');
  const terrain = noise1d(seed + ':terrain');
  const s = w / BLOCKS_ACROSS;
  const phase = opts.static ? 0.25 : (t / 90) % 1; // full day cycle every 90s
  const sun = Math.sin(phase * Math.PI * 2);
  const night = clamp(-sun * 1.6, 0, 1);
  const dusk = clamp(1 - Math.abs(sun) * 2.4, 0, 1);

  let sky = mixHex(SKY_DAY, SKY_NIGHT, night);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  if (dusk > 0) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, `rgba(0,0,0,0)`);
    g.addColorStop(1, mixHex(SKY_DUSK, '#ffd08a', 0.3));
    ctx.globalAlpha = dusk * 0.75;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }

  // stars
  if (night > 0.05) {
    ctx.globalAlpha = night;
    const srng = makeRng(seed + ':stars');
    for (let i = 0; i < 60; i++) {
      const sx = Math.floor(srng() * BLOCKS_ACROSS) * s;
      const sy = Math.floor(srng() * (h * 0.55) / s) * s;
      ctx.fillStyle = srng() > 0.7 ? '#ffffff' : '#c9d6ff';
      ctx.fillRect(sx, sy, s * 0.35, s * 0.35);
    }
    ctx.globalAlpha = 1;
  }

  // sun / moon riding an arc across the sky
  const bodyX = w * (0.5 + 0.42 * Math.cos((phase + 0.5) * Math.PI * 2));
  const bodyY = h * 0.62 - Math.sin(phase * Math.PI * 2) * h * 0.5;
  const isSun = sun >= 0;
  ctx.fillStyle = isSun ? '#fff2a8' : '#e8ecf5';
  ctx.fillRect(bodyX - s, bodyY - s, s * 2.4, s * 2.4);
  if (!isSun) {
    ctx.fillStyle = mixHex(SKY_DAY, SKY_NIGHT, night);
    ctx.fillRect(bodyX - s * 0.2, bodyY - s * 0.8, s * 1.2, s * 1.6);
  }

  // parallax clouds
  ctx.fillStyle = `rgba(255,255,255,${0.85 - night * 0.55})`;
  const crng = makeRng(seed + ':cloud');
  for (let i = 0; i < 5; i++) {
    const cy = Math.floor(crng() * 5 + 1) * s;
    const len = 3 + Math.floor(crng() * 5);
    const speed = 6 + crng() * 8;
    let cx = ((crng() * w + t * speed) % (w + len * s)) - len * s;
    for (let b = 0; b < len; b++) ctx.fillRect(cx + b * s, cy, s, s);
    ctx.fillRect(cx + s, cy - s, (len - 2) * s, s);
  }

  // far hills, then the ground the player walks on
  const scroll = opts.static ? 0 : t * 1.6;
  for (let layer = 0; layer < 2; layer++) {
    const depth = layer === 0 ? 0.45 : 1;
    const base = h * (layer === 0 ? 0.62 : 0.72);
    const grass = layer === 0 ? mixHex('#4b7a2b', sky, 0.35) : '#5aa832';
    const dirt = layer === 0 ? mixHex('#6b4b2a', sky, 0.35) : '#8a5a33';
    for (let x = -1; x <= BLOCKS_ACROSS + 1; x++) {
      const wx = x + scroll * depth * 0.25;
      const hgt = Math.round(terrain(wx * 0.12 + layer * 40) * (layer === 0 ? 4 : 3));
      const top = base - hgt * s;
      const px = x * s - ((scroll * depth * 0.25 * s) % s);
      block(ctx, px, top, s, grass, 0.14);
      for (let y = top + s; y < h; y += s) {
        const brng = makeRng(`${seed}:${x}:${y}:${layer}`);
        block(ctx, px, y, s, y > top + s * 3 ? '#6f6f6f' : dirt, 0.1);
        if (brng() > 0.88) speckle(ctx, px, y, s, brng, 'rgba(0,0,0,0.18)', 2);
      }
      // trees on the near layer only
      if (layer === 1) {
        const trng = makeRng(`${seed}:tree:${Math.floor(wx)}`);
        if (trng() > 0.86) {
          const th = 3 + Math.floor(trng() * 2);
          for (let k = 0; k < th; k++) block(ctx, px, top - (k + 1) * s, s, '#6b4a24', 0.12);
          for (let ly = -1; ly <= 1; ly++) {
            for (let lx = -2; lx <= 2; lx++) {
              if (Math.abs(lx) === 2 && ly === 1) continue;
              block(ctx, px + lx * s, top - (th + 1 + ly) * s, s, '#3f7d1e', 0.16);
            }
          }
        }
      }
    }
    if (layer === 0) {
      ctx.fillStyle = `rgba(${night > 0.5 ? '10,14,40' : '160,200,255'},0.22)`;
      ctx.fillRect(0, 0, w, h);
    }
  }

  // the little guy, bobbing as he "walks". Stacked head→body→legs so his feet
  // land exactly on the block he is standing on.
  if (opts.player !== false) {
    const bob = Math.abs(Math.sin(t * 4)) * s * 0.18;
    const px = w * 0.32;
    const groundTop = h * 0.72 - Math.round(terrain((w * 0.32 / s + scroll * 0.25) * 0.12 + 40) * 3) * s;
    const py = groundTop - s * 3.8 + bob;
    const swing = Math.sin(t * 4) * s * 0.2;
    ctx.fillStyle = '#c98d63'; ctx.fillRect(px, py, s * 1.2, s * 1.2);                      // head
    ctx.fillStyle = '#5c3b21'; ctx.fillRect(px, py, s * 1.2, s * 0.3);                      // hair
    ctx.fillStyle = '#f0f0f0'; ctx.fillRect(px + s * 0.2, py + s * 0.55, s * 0.25, s * 0.2);
    ctx.fillRect(px + s * 0.75, py + s * 0.55, s * 0.25, s * 0.2);
    ctx.fillStyle = '#2f6fb0'; ctx.fillRect(px + s * 0.1, py + s * 1.2, s, s * 1.4);        // body
    ctx.fillStyle = '#c98d63'; ctx.fillRect(px + s * 1.0, py + s * 1.3 + swing, s * 0.35, s * 1.1);
    ctx.fillStyle = '#3a3f8a';                                                              // legs
    ctx.fillRect(px + s * 0.1, py + s * 2.6, s * 0.42, s * 1.2 - swing * 0.5);
    ctx.fillRect(px + s * 0.68, py + s * 2.6, s * 0.42, s * 1.2 + swing * 0.5);
  }

  if (opts.rain) {
    ctx.strokeStyle = 'rgba(190,210,255,0.5)';
    ctx.lineWidth = Math.max(1, s * 0.1);
    for (let i = 0; i < 70; i++) {
      const rx = (rng() * w + t * 40) % w;
      const ry = (rng() * h + t * 700) % h;
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - s * 0.2, ry + s * 0.9); ctx.stroke();
    }
  }
}

/* ------------------------------------------------------------------- nether */

function nether(ctx, w, h, t, seed) {
  const s = w / BLOCKS_ACROSS;
  const rng = makeRng(seed + ':nether');
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#4a0d0d');
  g.addColorStop(1, '#8f1f0b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // netherrack ceiling
  for (let x = 0; x < BLOCKS_ACROSS; x++) {
    const drop = 1 + Math.round(noise1d(seed + ':ceil')(x * 0.3) * 3);
    for (let y = 0; y < drop; y++) {
      const brng = makeRng(`${seed}:c:${x}:${y}`);
      block(ctx, x * s, y * s, s, '#6e2626', 0.12);
      speckle(ctx, x * s, y * s, s, brng, 'rgba(0,0,0,0.25)', 2);
    }
  }

  // lava lake with a slow rolling surface
  const lavaTop = h * 0.74;
  ctx.fillStyle = '#ff7a18';
  ctx.fillRect(0, lavaTop, w, h - lavaTop);
  for (let x = 0; x < BLOCKS_ACROSS; x++) {
    const wave = Math.sin(t * 1.6 + x * 0.5) * s * 0.25;
    ctx.fillStyle = mixHex('#ffb43d', '#ff5f00', (Math.sin(t * 2 + x) + 1) / 2);
    ctx.fillRect(x * s, lavaTop + wave, s, s * 0.8);
  }
  const glow = ctx.createLinearGradient(0, lavaTop - h * 0.25, 0, lavaTop);
  glow.addColorStop(0, 'rgba(255,120,0,0)');
  glow.addColorStop(1, `rgba(255,150,30,${0.35 + Math.sin(t * 2) * 0.08})`);
  ctx.fillStyle = glow;
  ctx.fillRect(0, lavaTop - h * 0.25, w, h * 0.25);

  // netherrack platforms
  for (let i = 0; i < 3; i++) {
    const px = Math.floor(rng() * (BLOCKS_ACROSS - 8)) * s;
    const py = lavaTop - (2 + Math.floor(rng() * 3)) * s;
    const len = 4 + Math.floor(rng() * 5);
    for (let b = 0; b < len; b++) {
      block(ctx, px + b * s, py, s, '#7a2b2b', 0.12);
      block(ctx, px + b * s, py + s, s, '#5e2020', 0.1);
    }
  }

  // ghast drifting past
  const gx = ((t * 22) % (w + 8 * s)) - 4 * s;
  const gy = h * 0.3 + Math.sin(t * 0.9) * s * 1.5;
  ctx.fillStyle = '#e8e2e2';
  ctx.fillRect(gx, gy, s * 4, s * 4);
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(gx + s * 0.8, gy + s * 1.3, s * 0.7, s * 0.5);
  ctx.fillRect(gx + s * 2.5, gy + s * 1.3, s * 0.7, s * 0.5);
  ctx.fillRect(gx + s * 1.4, gy + s * 2.4, s * 1.2, s * 0.6);
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(gx + s * (0.4 + i * 0.8), gy + s * 4, s * 0.5, s * (1 + Math.sin(t * 3 + i) * 0.4));
  }

  // embers
  ctx.fillStyle = '#ffd27a';
  for (let i = 0; i < 40; i++) {
    const ex = (rng() * w + Math.sin(t + i) * s) % w;
    const ey = h - ((rng() * h + t * 30 * (0.5 + rng())) % h);
    ctx.globalAlpha = 0.3 + rng() * 0.5;
    ctx.fillRect(ex, ey, s * 0.22, s * 0.22);
  }
  ctx.globalAlpha = 1;
}

/* --------------------------------------------------------------------- cave */

function cave(ctx, w, h, t, seed) {
  const s = w / BLOCKS_ACROSS;
  ctx.fillStyle = '#0b0b0e';
  ctx.fillRect(0, 0, w, h);
  const floor = noise1d(seed + ':cavef');
  const roof = noise1d(seed + ':caver');

  for (let x = 0; x < BLOCKS_ACROSS; x++) {
    const fh = 3 + Math.round(floor(x * 0.25) * 4);
    const rh = 2 + Math.round(roof(x * 0.22) * 4);
    for (let y = 0; y < rh; y++) {
      const brng = makeRng(`${seed}:r:${x}:${y}`);
      block(ctx, x * s, y * s, s, '#3c3c42', 0.08);
      speckle(ctx, x * s, y * s, s, brng, 'rgba(0,0,0,0.3)', 2);
    }
    for (let y = 0; y < fh; y++) {
      const py = h - (y + 1) * s;
      const brng = makeRng(`${seed}:f:${x}:${y}`);
      block(ctx, x * s, py, s, '#45454c', 0.08);
      const r = brng();
      if (r > 0.93) speckle(ctx, x * s, py, s, brng, '#5ad7d7', 4);      // diamond
      else if (r > 0.88) speckle(ctx, x * s, py, s, brng, '#f2c14e', 4); // gold
      else if (r > 0.8) speckle(ctx, x * s, py, s, brng, '#c98d63', 4);  // copper
      else speckle(ctx, x * s, py, s, brng, 'rgba(0,0,0,0.28)', 2);
    }
  }

  // torchlight pooling on the walls, flickering
  const torches = [0.2, 0.5, 0.78];
  torches.forEach((tx, i) => {
    const flick = 0.82 + Math.sin(t * 9 + i * 2) * 0.1 + Math.sin(t * 23 + i) * 0.05;
    const cx = w * tx;
    const cy = h * 0.52;
    const rg = ctx.createRadialGradient(cx, cy, s * 0.5, cx, cy, s * 9 * flick);
    rg.addColorStop(0, 'rgba(255,190,90,0.55)');
    rg.addColorStop(0.5, 'rgba(255,150,60,0.14)');
    rg.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(cx - s * 10, cy - s * 10, s * 20, s * 20);
    ctx.fillStyle = '#6b4a24';
    ctx.fillRect(cx, cy, s * 0.4, s * 1.6);
    ctx.fillStyle = '#ffcf5c';
    ctx.fillRect(cx - s * 0.1, cy - s * 0.5, s * 0.6, s * 0.6);
  });

  // creeper lurking in the dark, breathing in and out of visibility
  const vis = clamp(Math.sin(t * 0.5) * 0.5 + 0.5, 0.12, 0.95);
  const cx = w * 0.66;
  const cy = h * 0.55;
  ctx.globalAlpha = vis;
  ctx.fillStyle = '#4f9e46';
  ctx.fillRect(cx, cy, s * 2, s * 2);
  ctx.fillStyle = '#0d1a0d';
  ctx.fillRect(cx + s * 0.3, cy + s * 0.5, s * 0.5, s * 0.5);
  ctx.fillRect(cx + s * 1.2, cy + s * 0.5, s * 0.5, s * 0.5);
  ctx.fillRect(cx + s * 0.7, cy + s * 1.1, s * 0.6, s * 0.7);
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------- redstone */

function redstone(ctx, w, h, t, seed) {
  const s = w / BLOCKS_ACROSS;
  const rng = makeRng(seed + ':rs');
  // Per-build variation, otherwise every redstone contraption looks alike.
  const palette = [['#5a5a62', '#63636b'], ['#6d6a60', '#78756b'], ['#8e8e96', '#9a9aa2']][Math.floor(rng() * 3)];
  const lampCount = 4 + Math.floor(rng() * 4);
  const pistonCount = 2 + Math.floor(rng() * 3);
  const repeaterGap = 6 + Math.floor(rng() * 4);
  const floorRow = 0.52 + rng() * 0.16;
  const speed = 0.9 + rng() * 0.9;

  ctx.fillStyle = '#1b1c22';
  ctx.fillRect(0, 0, w, h);

  // smooth-stone floor
  for (let x = 0; x < BLOCKS_ACROSS; x++) {
    for (let y = Math.floor(h * floorRow / s); y < h / s + 1; y++) {
      block(ctx, x * s, y * s, s, (x + y) % 2 ? palette[0] : palette[1], 0.07);
    }
  }

  const floorTop = Math.floor(h * floorRow / s) * s;
  const pulse = (t * speed) % 1;

  // dust line, lighting up left-to-right like a signal travelling
  for (let x = 0; x < BLOCKS_ACROSS; x++) {
    const lit = clamp(1 - Math.abs(x / BLOCKS_ACROSS - pulse) * 9, 0, 1);
    ctx.fillStyle = mixHex('#5a1010', '#ff2d2d', lit);
    ctx.fillRect(x * s, floorTop - s * 0.18, s, s * 0.18);
    if (lit > 0.4) {
      ctx.fillStyle = `rgba(255,60,60,${lit * 0.25})`;
      ctx.fillRect(x * s - s, floorTop - s * 2, s * 3, s * 2);
    }
  }

  // repeaters
  for (let i = 0; i * repeaterGap + 6 < BLOCKS_ACROSS; i++) {
    const bx = 6 + i * repeaterGap;
    const rx = bx * s;
    const lit = clamp(1 - Math.abs(bx / BLOCKS_ACROSS - pulse) * 9, 0, 1);
    ctx.fillStyle = '#9a9aa2';
    ctx.fillRect(rx, floorTop - s * 0.3, s, s * 0.3);
    ctx.fillStyle = lit > 0.4 ? '#ff4d4d' : '#5a1010';
    ctx.fillRect(rx + s * 0.15, floorTop - s * 0.5, s * 0.2, s * 0.2);
  }

  // lamps blinking in sequence
  const lampGap = (BLOCKS_ACROSS - 6) / lampCount;
  for (let i = 0; i < lampCount; i++) {
    const lx = (3 + i * lampGap) * s;
    const on = Math.sin(t * 2 - i * 0.7) > 0;
    block(ctx, lx, floorTop - s * 3, s * 1.6, on ? '#ffd98a' : '#4a4436', 0.12);
    if (on) {
      const rg = ctx.createRadialGradient(lx + s * 0.8, floorTop - s * 2.2, s * 0.3, lx + s * 0.8, floorTop - s * 2.2, s * 5);
      rg.addColorStop(0, 'rgba(255,215,140,0.35)');
      rg.addColorStop(1, 'rgba(255,215,140,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(lx - s * 4, floorTop - s * 7, s * 10, s * 10);
    }
  }

  // pistons firing
  for (let i = 0; i < pistonCount; i++) {
    const px = (8 + i * (24 / pistonCount)) * s;
    const ext = clamp(Math.sin(t * 3 - i) * 2, 0, 1);
    block(ctx, px, floorTop - s * 5, s * 1.4, '#7d6a4a', 0.12);
    ctx.fillStyle = '#c8b58c';
    ctx.fillRect(px + s * 0.1, floorTop - s * 5 - ext * s, s * 1.2, s * 0.5 + ext * s);
  }
}

/* -------------------------------------------------------------------- build */

function build(ctx, w, h, t, seed) {
  const s = w / BLOCKS_ACROSS;
  const rng = makeRng(seed + ':build');
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#8fc9f2');
  g.addColorStop(1, '#dbeeff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  const groundTop = h * 0.78;
  for (let x = 0; x < BLOCKS_ACROSS; x++) {
    block(ctx, x * s, groundTop, s, '#5aa832', 0.14);
    for (let y = groundTop + s; y < h; y += s) block(ctx, x * s, y, s, '#8a5a33', 0.1);
  }

  // a castle that assembles itself over the clip's length
  const left = 5 + Math.floor(rng() * 5);
  const right = BLOCKS_ACROSS - 4 - Math.floor(rng() * 6);
  const towerH = 7 + Math.floor(rng() * 4);
  const wallBase = 4 + Math.floor(rng() * 3);
  const towerGap = 5 + Math.floor(rng() * 4);
  const stones = [['#8d8d95', '#a2a2aa'], ['#a89274', '#bda884'], ['#7f8a99', '#93a0af']][Math.floor(rng() * 3)];

  const plan = [];
  for (let x = left; x < right; x++) {
    const isTower = x === left || x === right - 1 || (x - left) % towerGap === 0;
    const wallH = x === left || x === right - 1 ? towerH : (isTower ? towerH - 1 : wallBase);
    for (let y = 0; y < wallH; y++) plan.push([x, y]);
  }
  plan.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const progress = clamp((t % 30) / 24, 0, 1);
  const built = Math.floor(plan.length * progress);
  for (let i = 0; i < built; i++) {
    const [bx, by] = plan[i];
    block(ctx, bx * s, groundTop - (by + 1) * s, s, (bx + by) % 3 === 0 ? stones[0] : stones[1], 0.12);
  }
  // the block currently being placed, with a little placement flash
  if (built < plan.length) {
    const [bx, by] = plan[built];
    ctx.globalAlpha = 0.5 + Math.sin(t * 12) * 0.3;
    block(ctx, bx * s, groundTop - (by + 1) * s, s, '#ffffff', 0.2);
    ctx.globalAlpha = 1;
  }

  // scaffolding clouds
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < 4; i++) {
    const cy = Math.floor(rng() * 4 + 1) * s;
    const len = 3 + Math.floor(rng() * 4);
    const cx = ((rng() * w + t * 5) % (w + len * s)) - len * s;
    for (let b = 0; b < len; b++) ctx.fillRect(cx + b * s, cy, s, s);
  }
}

/* -------------------------------------------------------------------- ocean */

function ocean(ctx, w, h, t, seed) {
  const s = w / BLOCKS_ACROSS;
  const rng = makeRng(seed + ':ocean');
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#1b6fa8');
  g.addColorStop(1, '#052744');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // god rays
  for (let i = 0; i < 5; i++) {
    const rx = w * (0.1 + i * 0.2) + Math.sin(t * 0.4 + i) * s * 2;
    ctx.fillStyle = `rgba(180,225,255,${0.05 + Math.sin(t + i) * 0.02})`;
    ctx.beginPath();
    ctx.moveTo(rx, 0); ctx.lineTo(rx + s * 2, 0); ctx.lineTo(rx + s * 6, h); ctx.lineTo(rx, h);
    ctx.fill();
  }

  // seabed
  const bed = noise1d(seed + ':bed');
  for (let x = 0; x < BLOCKS_ACROSS; x++) {
    const hgt = 2 + Math.round(bed(x * 0.3) * 3);
    for (let y = 0; y < hgt; y++) {
      block(ctx, x * s, h - (y + 1) * s, s, y === hgt - 1 ? '#c8bb8a' : '#9c8f63', 0.1);
    }
    if (makeRng(`${seed}:kelp:${x}`)() > 0.82) {
      const kh = 3 + Math.floor(makeRng(`${seed}:kh:${x}`)() * 4);
      for (let k = 0; k < kh; k++) {
        const sway = Math.sin(t * 1.5 + k * 0.5 + x) * s * 0.3;
        block(ctx, x * s + sway, h - (hgt + k + 1) * s, s * 0.8, '#3d8b4a', 0.14);
      }
    }
  }

  // fish
  for (let i = 0; i < 7; i++) {
    const speed = 12 + rng() * 25;
    const fy = h * (0.15 + rng() * 0.5);
    const fx = ((rng() * w + t * speed) % (w + s * 4)) - s * 2;
    const col = ['#f5a623', '#e8e8e8', '#5ad7d7', '#d95555'][Math.floor(rng() * 4)];
    ctx.fillStyle = col;
    ctx.fillRect(fx, fy + Math.sin(t * 3 + i) * s * 0.3, s * 1.1, s * 0.7);
    ctx.fillRect(fx - s * 0.4, fy + s * 0.15 + Math.sin(t * 3 + i) * s * 0.3, s * 0.4, s * 0.4);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(fx + s * 0.75, fy + s * 0.2 + Math.sin(t * 3 + i) * s * 0.3, s * 0.18, s * 0.18);
  }

  // bubbles
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 30; i++) {
    const bx = rng() * w + Math.sin(t + i) * s * 0.4;
    const by = h - ((rng() * h + t * 25) % h);
    ctx.fillRect(bx, by, s * 0.25, s * 0.25);
  }
}

const SCENES = { overworld, nether, cave, redstone, build, ocean };

/* Ground line per style, so explosions and mobs land on the surface the scene
   actually drew rather than floating over it. */
const GROUND = { overworld: 0.72, nether: 0.74, cave: 0.86, redstone: 0.6, build: 0.78, ocean: 0.88 };

function drawScene(ctx, w, h, t, seed, style, opts = {}) {
  const fn = SCENES[style] || overworld;
  const time = Math.max(0, t);
  const script = opts.video ? scriptFor(opts.video) : null;
  const st = script ? stateAt(script, time, opts.video) : null;

  ctx.save();
  if (st && st.shake > 0.01) {
    // camera kick, seeded off the time so it stays the same on replay
    const k = st.shake * w * 0.012;
    ctx.translate(Math.sin(time * 61) * k, Math.cos(time * 47) * k);
  }
  fn(ctx, w, h, time, seed, opts);
  if (script) drawEvents(ctx, w, h, time, script, { ground: GROUND[style] ?? 0.72 });
  ctx.restore();

  if (st) {
    drawOverlays(ctx, w, h, st);
    if (opts.hud) drawHud(ctx, w, h, time, opts.video, st);
  }
}

/* Thumbnails freeze the clip on its headline moment — the frame with the
   explosion in it — plus the big blocky caption every Minecraft thumbnail on
   the internet seems to be legally required to have. */
function drawThumbnail(canvas, video) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  let t = video.thumbTime ?? peakTime(video) + 0.22;
  // the castle assembles on a 30s cycle — land near the end of one
  if (video.style === 'build') t = Math.floor(t / 30) * 30 + 22;
  drawScene(ctx, w, h, t, video.seed, video.style, { video });

  if (video.overlay) {
    const fs = Math.round(h * 0.19);
    ctx.font = `900 ${fs}px "Segoe UI", system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const tx = w / 2;
    const ty = h * 0.24;
    ctx.lineWidth = Math.max(3, fs * 0.16);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineJoin = 'round';
    ctx.strokeText(video.overlay, tx, ty);
    ctx.fillStyle = video.overlayColor || '#ffe14d';
    ctx.fillText(video.overlay, tx, ty);
  }
}

function commentsFor(videoId, count = 8) {
  let h = 0;
  for (let i = 0; i < videoId.length; i++) h = (h * 31 + videoId.charCodeAt(i)) >>> 0;
  const out = [];
  for (let i = 0; i < count; i++) {
    const [author, text, likes, hours] = COMMENT_POOL[(h + i * 7) % COMMENT_POOL.length];
    out.push({
      author,
      text,
      likes: Math.round(likes * (0.4 + (((h >> i) & 7) / 7))),
      hours: hours + i * 3,
      replies: ((h >> (i + 2)) & 3) === 0 ? 1 + ((h >> i) & 7) : 0,
      color: `hsl(${(h + i * 47) % 360} 55% 45%)`,
    });
  }
  return out;
}
