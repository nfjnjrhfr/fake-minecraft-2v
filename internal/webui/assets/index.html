<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>veil 控制台</title>
<!-- Inlined so the page makes no request the server would have to answer with
     a 404, and so the console works with no assets beyond this one file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9l8-3z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b1020;
    --panel: #151b31;
    --panel-2: #1c2440;
    --line: #26304f;
    --text: #e8ecf8;
    --muted: #8b97b8;
    --on: #21d07a;
    --on-dim: #21d07a33;
    --off: #6a77a0;
    --warn: #ffb020;
    --err: #ff5c6c;
    --accent: #5b8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f5fc; --panel: #ffffff; --panel-2: #f7f9ff; --line: #e2e8f5;
      --text: #131a2e; --muted: #6b7796; --off: #97a2bd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 40px; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--accent), #9d6bff);
    display: grid; place-items: center; font-size: 16px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

  /* --- the connect button --- */
  .dial { display: grid; place-items: center; margin: 6px 0 18px; }
  .power {
    width: 168px; height: 168px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--panel); color: var(--off);
    display: grid; place-items: center; gap: 6px;
    box-shadow: 0 0 0 1px var(--line), 0 12px 32px #0003;
    transition: color .25s, box-shadow .35s, transform .12s;
    font: inherit;
  }
  .power:active { transform: scale(.97); }
  .power svg { width: 52px; height: 52px; }
  .power .label { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  .power[data-state="connected"] {
    color: var(--on);
    box-shadow: 0 0 0 1px var(--on-dim), 0 0 0 12px var(--on-dim), 0 12px 40px #21d07a26;
  }
  .power[data-state="connecting"] { color: var(--warn); }
  .power[data-state="connecting"] svg { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .power:disabled { cursor: default; opacity: .8; }

  .statusline { text-align: center; margin-bottom: 4px; font-weight: 600; }
  .where { text-align: center; color: var(--muted); font-size: 13px; min-height: 20px; }

  /* --- stats --- */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin: 20px 0; padding: 14px 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .stat { text-align: center; }
  .stat .v { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* --- server list --- */
  .listhead {
    display: flex; align-items: center; margin: 22px 0 10px;
    font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
  }
  .listhead button {
    margin-left: auto; text-transform: none; letter-spacing: 0;
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .listhead button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  .listhead button:disabled { opacity: .5; cursor: default; }

  .servers { display: grid; gap: 8px; }
  .server {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 13px 14px; border-radius: 13px; cursor: pointer; font: inherit; color: inherit;
    background: var(--panel); border: 1px solid var(--line);
    transition: border-color .15s, background .15s;
  }
  .server:hover:not(:disabled) { border-color: var(--accent); }
  .server:disabled { cursor: default; }
  .server[aria-current="true"] { border-color: var(--on); background: var(--panel-2); }
  .flag { font-size: 24px; line-height: 1; flex: none; }
  .meta { min-width: 0; flex: 1; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .lat.good { color: var(--on); }
  .lat.slow { color: var(--warn); }
  .lat.dead { color: var(--err); }
  .tick { color: var(--on); flex: none; }

  /* --- notices --- */
  .notice {
    margin: 14px 0; padding: 11px 13px; border-radius: 11px; font-size: 13px;
    border: 1px solid; display: flex; gap: 9px; align-items: flex-start;
  }
  .notice.warn { border-color: #ffb02044; background: #ffb0200f; color: var(--warn); }
  .notice.err  { border-color: #ff5c6c44; background: #ff5c6c0f; color: var(--err); }
  .notice.info { border-color: var(--line); background: var(--panel); color: var(--muted); }
  .notice code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: #0003; padding: 1px 5px; border-radius: 5px;
  }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🛡️</div>
    <h1>veil</h1>
    <div class="sub" id="proxyAddr"></div>
  </header>

  <div class="dial">
    <button class="power" id="power" data-state="disconnected" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" aria-hidden="true">
        <path d="M12 3v9"/>
        <path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
      </svg>
      <span class="label" id="powerLabel">載入中</span>
    </button>
  </div>

  <div class="statusline" id="statusLine">載入中…</div>
  <div class="where" id="whereLine"></div>

  <div class="stats">
    <div class="stat"><div class="v" id="statTime">--:--</div><div class="k">連線時間</div></div>
    <div class="stat"><div class="v" id="statDown">0 B</div><div class="k">下載</div></div>
    <div class="stat"><div class="v" id="statUp">0 B</div><div class="k">上傳</div></div>
  </div>

  <div class="notice err hide" id="errBox"></div>
  <div class="notice warn hide" id="offBox"></div>

  <div class="listhead">
    節點
    <button id="testAll">測速</button>
  </div>
  <div class="servers" id="servers"></div>

  <div class="notice info" id="howto">
    把應用程式的代理指向
    <code id="howtoAddr">127.0.0.1:1080</code>
    ，SOCKS5 與 HTTP 皆可。
  </div>

</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const HEADERS = { "Content-Type": "application/json", "X-Veil-Console": "1" };

let servers = [];
let status = null;
let busy = false;

// The API refuses anything without this header, so every call goes through here.
async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: HEADERS,
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// A two-letter country code maps onto regional indicator symbols, which render
// as that country's flag. Anything else falls back to a globe.
function flagOf(cc) {
  if (!cc || cc.length !== 2 || !/^[a-zA-Z]{2}$/.test(cc)) return "🌐";
  return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}

function humanBytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), units.length - 1);
  const v = n / Math.pow(1024, i);
  return `${v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)} ${units[i]}`;
}

function humanTime(sec) {
  if (!sec || sec < 0) return "--:--";
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function latencyClass(ms) {
  if (ms < 0) return "dead";
  if (ms < 150) return "good";
  if (ms < 400) return "slow";
  return "dead";
}

function renderServers() {
  const box = $("servers");
  box.textContent = "";

  for (const s of servers) {
    const active = status && status.state === "connected" && status.server_id === s.id;

    const btn = document.createElement("button");
    btn.className = "server";
    btn.setAttribute("aria-current", active ? "true" : "false");
    btn.disabled = busy;
    btn.onclick = () => (active ? disconnect() : connect(s.id));

    const flag = document.createElement("div");
    flag.className = "flag";
    flag.textContent = flagOf(s.country);

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = s.name;
    const addr = document.createElement("div");
    addr.className = "addr";
    addr.textContent = s.address;
    meta.append(name, addr);

    const lat = document.createElement("div");
    lat.className = "lat " + latencyClass(s.latency_ms);
    lat.textContent = s.latency_ms < 0 ? "—" : `${s.latency_ms} ms`;

    btn.append(flag, meta, lat);
    if (active) {
      const tick = document.createElement("div");
      tick.className = "tick";
      tick.textContent = "●";
      btn.append(tick);
    }
    box.append(btn);
  }

  if (!servers.length) {
    const empty = document.createElement("div");
    empty.className = "notice info";
    empty.textContent = "設定檔裡沒有節點。";
    box.append(empty);
  }
}

function renderStatus() {
  if (!status) return;

  const power = $("power");
  const state = status.state;
  power.dataset.state = state;
  power.disabled = busy || !servers.length;

  const labels = { connected: "已連線", connecting: "連線中", disconnected: "未連線" };
  $("powerLabel").textContent = labels[state] || state;
  $("statusLine").textContent =
    state === "connected" ? "流量正通過加密通道"
    : state === "connecting" ? "正在建立通道…"
    : "通道未啟用";

  $("whereLine").textContent =
    state === "connected" && status.server_name
      ? `${flagOf(status.country)} ${status.server_name}`
      : "";

  $("statTime").textContent = humanTime(status.connected_seconds);
  $("statDown").textContent = humanBytes(status.bytes_down);
  $("statUp").textContent = humanBytes(status.bytes_up);

  $("proxyAddr").textContent = status.proxy_listen || "";
  $("howtoAddr").textContent = status.proxy_listen || "127.0.0.1:1080";

  const err = $("errBox");
  err.classList.toggle("hide", !status.last_error);
  if (status.last_error) err.textContent = "連線失敗：" + status.last_error;

  // Say plainly what happens to traffic right now. "Disconnected" means two
  // very different things depending on this setting, and guessing wrong is
  // how a leak goes unnoticed.
  const off = $("offBox");
  const showOff = state !== "connected";
  off.classList.toggle("hide", !showOff);
  if (showOff) {
    off.textContent = status.when_disconnected === "block"
      ? "未連線時，經過本機代理的流量會被拒絕，不會以未加密的方式送出。"
      : "注意：未連線時流量會直接送出，不經過通道也未加密。";
    off.className = "notice " + (status.when_disconnected === "block" ? "warn" : "err");
  }

  renderServers();
}

async function refresh() {
  try {
    status = await api("/api/status");
    renderStatus();
  } catch (e) {
    $("statusLine").textContent = "無法連上本機服務";
    $("whereLine").textContent = String(e.message || e);
  }
}

async function loadServers() {
  try {
    const data = await api("/api/servers");
    servers = data.servers || [];
    renderServers();
  } catch (e) { /* the status poll surfaces the error */ }
}

async function connect(id) {
  if (busy) return;
  busy = true;
  status = { ...(status || {}), state: "connecting", server_id: id, last_error: "" };
  renderStatus();
  try {
    status = await api("/api/connect", { server_id: id });
  } catch (e) {
    await refresh();
    status.last_error = String(e.message || e);
  } finally {
    busy = false;
    renderStatus();
    loadServers();
  }
}

async function disconnect() {
  if (busy) return;
  busy = true;
  try {
    status = await api("/api/disconnect", {});
  } catch (e) { /* refreshed below */ }
  finally {
    busy = false;
    await refresh();
  }
}

$("power").onclick = () => {
  if (!status) return;
  if (status.state === "connected") return disconnect();
  const target = status.server_id || (servers[0] && servers[0].id);
  if (target) connect(target);
};

$("testAll").onclick = async () => {
  const btn = $("testAll");
  btn.disabled = true;
  btn.textContent = "測速中…";
  try {
    const data = await api("/api/ping", {});
    servers = data.servers || servers;
    renderServers();
  } catch (e) { /* leave the previous numbers in place */ }
  finally {
    btn.disabled = false;
    btn.textContent = "測速";
  }
};

loadServers();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
